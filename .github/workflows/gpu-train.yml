name: Colab T4 GPU Training

on:
  push:
  workflow_dispatch:

jobs:
  train:
    runs-on: [self-hosted, gpu-runner]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install torch torchvision

      - name: Show GPU
        run: nvidia-smi

      - name: Run training
        run: python train.py